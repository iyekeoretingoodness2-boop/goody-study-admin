<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goody Study App — Student Portal</title>
<style>
:root{--navy:#10264b;--blue:#2456c7;--gold:#e5b84b;--bg:#f3f6fb;--ink:#1d2939;--muted:#667085;--line:#e5eaf2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:18px 16px}header h1{font-size:21px;margin:0}header p{margin:5px 0 0;color:#d8e2f3;font-size:13px}main{max-width:520px;margin:26px auto;padding:0 14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 16px #12284b0a}h2{color:var(--navy);font-size:20px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.5}label{display:block;font-size:13px;font-weight:bold;margin:13px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}button{border:0;border-radius:9px;padding:13px 15px;background:var(--blue);color:white;font-weight:bold;font-size:14px;width:100%;margin-top:15px}button:disabled{opacity:.6}.secondary{background:#edf2fa;color:var(--navy)}.notice{padding:12px;border-radius:9px;background:#fff6dc;color:#6b520b;font-size:13px;line-height:1.5;margin-top:12px}.error{background:#fff0f0;color:#9b2525}.success{background:#eaf8ef;color:#17643b}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{margin:0}.tabs .secondary{background:#edf2fa;color:var(--navy)}
</style></head><body>
<header><h1>Goody Study App</h1><p>Student learning portal</p></header><main>
<section class="card" id="authCard"><h2 id="formTitle">Create your student account</h2><p class="muted" id="formIntro">Register with your details, then verify your phone number by SMS. Your account will be sent for administrator approval.</p>
<div class="tabs"><button id="registerTab">Register</button><button id="loginTab" class="secondary">Sign in</button></div>
<div id="registerForm">
<label for="fullName">Full name</label><input id="fullName" autocomplete="name" placeholder="Your full name">
<label for="phone">Phone number (include country code)</label><input id="phone" type="tel" autocomplete="tel" placeholder="+2348012345678">
<label for="regEmail">Email address</label><input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com">
<label for="regPassword">Create password</label><input id="regPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters">
<button id="createAccount">Create account and send verification code</button><div id="recaptcha-container"></div>
<div id="codeArea" class="hidden"><label for="smsCode">SMS verification code</label><input id="smsCode" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter the code sent to your phone"><button id="verifyCode">Verify phone and finish registration</button></div>
</div>
<div id="loginForm" class="hidden"><label for="loginEmail">Email address</label><input id="loginEmail" type="email" autocomplete="email"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="signIn">Sign in</button></div>
<div id="message" class="notice hidden" role="status"></div></section>
<section class="card hidden" id="studentCard"><h2 id="welcome">Welcome</h2><p class="muted" id="studentStatus"></p><div class="notice" id="studentNotice"></div><button id="signOut" class="secondary">Sign out</button></section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,RecaptchaVerifier,linkWithPhoneNumber} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB_tJO7MEU1b6IhmcKQVnyQjOicuLOABpw",authDomain:"goody-study-app-d1083.firebaseapp.com",projectId:"goody-study-app-d1083",storageBucket:"goody-study-app-d1083.firebasestorage.app",messagingSenderId:"698337451094",appId:"1:698337451094:web:e4f49ec6fc9e1d297baff7",measurementId:"G-D0KTJBWRP0"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let confirmation=null,verifier=null,registrationDetails=null,registrationInProgress=false;
function message(text,error=false){$("message").textContent=text;$("message").className="notice"+(error?" error":"");}
function friendly(e){const m={"auth/email-already-in-use":"This email already has an account. Please sign in.","auth/invalid-email":"Enter a valid email address.","auth/weak-password":"Use a password with at least 6 characters.","auth/invalid-phone-number":"Enter a valid phone number with country code, e.g. +2348012345678.","auth/too-many-requests":"Too many attempts. Please wait and try again.","auth/unauthorized-domain":"Add this website to Firebase Authentication > Settings > Authorized domains."};return m[e.code]||e.message||"Something went wrong. Please try again."}
function switchMode(mode){const reg=mode==="register";$("registerForm").classList.toggle("hidden",!reg);$("loginForm").classList.toggle("hidden",reg);$("formTitle").textContent=reg?"Create your student account":"Student sign in";$("formIntro").textContent=reg?"Register with your details, then verify your phone number by SMS. Your account will be sent for administrator approval.":"Sign in to check your student account status.";$("registerTab").className=reg?"":"secondary";$("loginTab").className=reg?"secondary":"";$("message").classList.add("hidden")}
$("registerTab").onclick=()=>switchMode("register");$("loginTab").onclick=()=>switchMode("login");
$("createAccount").onclick=async()=>{const fullName=$("fullName").value.trim(),phone=$("phone").value.trim(),email=$("regEmail").value.trim(),password=$("regPassword").value;if(!fullName||!phone||!email||!password){message("Please complete all fields.",true);return}if(!/^\+[1-9]\d{7,14}$/.test(phone)){message("Use international format, e.g. +2348012345678.",true);return}if(password.length<6){message("Password must be at least 6 characters.",true);return}$("createAccount").disabled=true;registrationInProgress=true;try{const cred=await createUserWithEmailAndPassword(auth,email,password);registrationDetails={fullName,phone,email};verifier=new RecaptchaVerifier(auth,"recaptcha-container",{});confirmation=await linkWithPhoneNumber(cred.user,phone,verifier);$("codeArea").classList.remove("hidden");message("Verification code sent. Enter the SMS code below.");}catch(e){registrationInProgress=false;message(friendly(e),true);if(verifier){try{verifier.clear()}catch{}verifier=null}}finally{$("createAccount").disabled=false}};
$("verifyCode").onclick=async()=>{const code=$("smsCode").value.trim();if(!confirmation||!code){message("Enter the SMS verification code.",true);return}$("verifyCode").disabled=true;try{const result=await confirmation.confirm(code),u=result.user;await setDoc(doc(db,"users",u.uid),{uid:u.uid,fullName:registrationDetails.fullName,phone:u.phoneNumber||registrationDetails.phone,email:u.email,role:"student",status:"pending",phoneVerified:true,createdAt:serverTimestamp()});registrationInProgress=false;showStudent({fullName:registrationDetails.fullName,status:"pending"});}catch(e){message(friendly(e),true)}finally{$("verifyCode").disabled=false}};
$("signIn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value)}catch(e){message(friendly(e),true)}};
function showStudent(data){$("authCard").classList.add("hidden");$("studentCard").classList.remove("hidden");$("welcome").textContent="Welcome, "+(data.fullName||"Student");const s=data.status||"unknown";$("studentStatus").textContent="Account status: "+s.toUpperCase();$("studentNotice").textContent=s==="approved"?"Your account is approved. Your study dashboard will appear here as learning features are added.":s==="pending"?"Your registration is complete and your phone is verified. Please wait for the administrator to approve your account.":"Please contact the administrator to check your account."}
onAuthStateChanged(auth,async user=>{if(!user)return;try{const snap=await getDoc(doc(db,"users",user.uid));if(snap.exists())showStudent(snap.data());else if(!registrationInProgress)message("Your sign-in is active, but no student profile exists yet. If you just registered, finish phone verification. If verification was interrupted, contact the administrator for help.",true)}catch(e){message(friendly(e),true)}});
$("signOut").onclick=()=>signOut(auth);
</script></body></html>
